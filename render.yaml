# Render Blueprint, at the root of the repo because the repo is the app.
#
# Free plan: no persistent disk, so a report lives only as long as the instance
# does — every deploy and every idle spin-down clears it. Fine for a public demo,
# not for anything anyone needs to keep. To make runs durable, move to a paid
# instance, uncomment the disk block below, and set SCAN_DB to /data/scan.db.
# Do NOT uncomment it while still on the free plan: a blueprint that declares a
# disk it cannot have fails to deploy at all.
services:
  - type: web
    name: atlan-scan
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: SCAN_DB
        value: /tmp/scan.db
      # BASE_URL is not needed on Render — RENDER_EXTERNAL_URL is injected and used
      # automatically, which also makes badge links come out as https.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
